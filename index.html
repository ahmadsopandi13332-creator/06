<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Render Dataset Multi Elemen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f5f5f5;
    }
    h1 { text-align: center; }
    h2 { font-size: 18px; margin-top: 30px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th { background: #007BFF; color: #fff; }

    ul {
      background: #fff;
      padding: 15px 30px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      padding: 10px;
      margin-bottom: 5px;
      border-left: 4px solid #007BFF;
    }

    select {
      padding: 6px 12px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Render Dataset ke Banyak Elemen</h1>

  <!-- REVERSIBLE: Tinggal pilih sumber data -->
  <label>Pilih Sumber Data: </label>
  <select id="sourceSelect" onchange="gantiSumber()">
    <option value="lokal">Data Lokal</option>
    <option value="api">Data API (JSONPlaceholder)</option>
  </select>

  <h2>📋 Tabel 1</h2>
  <table>
    <thead>
      <tr><th>ID</th><th>Nama</th><th>Email</th></tr>
    </thead>
    <tbody id="table1"></tbody>
  </table>

  <h2>📋 Tabel 2 (Nomor Urut)</h2>
  <table>
    <thead>
      <tr><th>No</th><th>Nama</th><th>Email</th></tr>
    </thead>
    <tbody id="table2"></tbody>
  </table>

  <h2>📝 List</h2>
  <ul id="list"></ul>

  <h2>🃏 Cards</h2>
  <div id="cards"></div>

  <script>
    // ==========================================
    // DATA SOURCE (REVERSIBLE)
    // ==========================================
    const dataLokal = [
      { id: 1, nama: "Ahmad", email: "ahmad@email.com" },
      { id: 2, nama: "Siti", email: "siti@email.com" },
      { id: 3, nama: "Budi", email: "budi@email.com" },
      { id: 4, nama: "Dewi", email: "dewi@email.com" },
    ];

    async function ambilData(sumber) {
      if (sumber === "lokal") {
        return dataLokal;
      } else {
        // Mapping dari API ke struktur yang sama
        const res = await fetch("https://jsonplaceholder.typicode.com/users");
        const data = await res.json();
        return data.map(u => ({
          id: u.id,
          nama: u.name,
          email: u.email,
        }));
      }
    }

    // ==========================================
    // RENDER SEMUA (DRY — 1 fungsi panggil semua)
    // ==========================================
    function renderSemua(data) {
      renderTabel1(data);
      renderTabel2(data);
      renderList(data);
      renderCards(data);
    }

    // ==========================================
    // RENDER MASING-MASING (MODULAR)
    // ==========================================
    function renderTabel1(data) {
      document.getElementById("table1").innerHTML = data
        .map(u => `<tr><td>${u.id}</td><td>${u.nama}</td><td>${u.email}</td></tr>`)
        .join("");
    }

    function renderTabel2(data) {
      document.getElementById("table2").innerHTML = data
        .map((u, i) => `<tr><td>${i + 1}</td><td>${u.nama}</td><td>${u.email}</td></tr>`)
        .join("");
    }

    function renderList(data) {
      document.getElementById("list").innerHTML = data
        .map(u => `<li>${u.id} - ${u.nama} (${u.email})</li>`)
        .join("");
    }

    function renderCards(data) {
      document.getElementById("cards").innerHTML = data
        .map(u => `
          <div class="card">
            <strong>ID:</strong> ${u.id}<br>
            <strong>Nama:</strong> ${u.nama}<br>
            <strong>Email:</strong> ${u.email}
          </div>
        `)
        .join("");
    }

    // ==========================================
    // GANTI SUMBER DATA (REVERSIBLE)
    // ==========================================
    async function gantiSumber() {
      const sumber = document.getElementById("sourceSelect").value;
      const data = await ambilData(sumber);
      renderSemua(data);
    }

    // ==========================================
    // INIT (JALAN PERTAMA KALI)
    // ==========================================
    renderSemua(dataLokal);
  </script>

</body>
</html>
