<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Table Fix Sesuai Contoh</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    text-align: center;
    min-height: 100vh;
    padding: 20px 0;
}

/* CONTAINER */
.container {
    width: 60%;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.95);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
}

/* JUDUL */
h2 {
    margin: 25px 0 10px;
    font-weight: bold;
    color: #4a5568;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 20px;
    border-bottom: 3px solid #667eea;
    padding-bottom: 10px;
    display: inline-block;
}

/* TABLE */
.table-custom {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

/* HEADER */
.table-custom th {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* BODY */
.table-custom td {
    padding: 10px;
    background: #f7fafc;
    transition: background 0.3s ease;
}

.table-custom tbody tr:hover td {
    background: #e2e8f0;
}

/* GARIS TIPIS */
.table-custom th,
.table-custom td {
    border: 1px solid #cbd5e0;
}

/* LIST */
.list {
    text-align: left;
    margin: 0 auto 30px;
    width: 80%;
    list-style: none;
    padding: 0;
}

.list li {
    padding: 12px 15px;
    border-bottom: 1px solid #e2e8f0;
    background: #f7fafc;
    margin-bottom: 5px;
    border-radius: 5px;
    transition: all 0.3s ease;
    border-left: 4px solid #667eea;
}

.list li:hover {
    background: #edf2f7;
    transform: translateX(5px);
    border-left-color: #764ba2;
}

/* CARD */
.card-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.card {
    width: 150px;
    padding: 20px;
    border-radius: 15px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
    transition: transform 0.5s ease;
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
}

.card:hover::before {
    transform: scale(1.2);
}

.card strong {
    display: block;
    font-size: 18px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

.card p {
    margin: 0;
    font-size: 14px;
    opacity: 0.9;
    position: relative;
    z-index: 1;
}

</style>
</head>
<body>

<div class="container">

    <h2>TABLE 1 (Render Biasa)</h2>
    <table class="table-custom">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table1"></tbody>
    </table>

    <h2>TABLE 2 (DRY, REUSE, MODULAR)</h2>
    <table class="table-custom">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table2"></tbody>
    </table>

    <h2>LIST 1 (Dari Table 1)</h2>
    <ul id="list1" class="list"></ul>

    <h2>LIST 2 (Dari Table 2)</h2>
    <ul id="list2" class="list"></ul>

    <h2>CARD 1 (Dari Table 1)</h2>
    <div id="card1" class="card-container"></div>

    <h2>CARD 2 (Dari Table 2)</h2>
    <div id="card2" class="card-container"></div>

</div>

<script>

// DATA
const data = [
    { id: 1, nama: "Reyshan" },
    { id: 2, nama: "Adjie" },
    { id: 3, nama: "Dimas" },
    { id: 4, nama: "Didi" }
];

// TEMPLATE
const tableRow = (item) => `
<tr>
    <td>${item.id}</td>
    <td>${item.nama}</td>
</tr>`;

const listItem = (item) => `
<li>${item.id} - ${item.nama}</li>`;

const cardItem = (item) => `
<div class="card">
    <strong>${item.nama}</strong>
    <p>ID: ${item.id}</p>
</div>`;

// CORE RENDER (DRY)
function render(target, template) {
    document.getElementById(target).innerHTML =
        data.map(template).join("");
}

// INIT
render("table1", tableRow);
render("table2", tableRow);
render("list1", listItem);
render("list2", listItem);
render("card1", cardItem);
render("card2", cardItem);

</script>

</body>
</html>
