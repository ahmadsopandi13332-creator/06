<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Table Fix Sesuai Contoh</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eee;
    text-align: center;
}

/* CONTAINER */
.container {
    width: 60%;
    margin: 20px auto;
}

/* JUDUL */
h2 {
    margin: 25px 0 10px;
    font-weight: bold;
}

/* TABLE */
.table-custom {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 30px;
}

/* HEADER */
.table-custom th {
    background: #0a7a0a; /* hijau */
    color: white;
    padding: 10px;
    font-weight: bold;
}

/* BODY */
.table-custom td {
    padding: 10px;
    background: #e5e5e5;
}

/* GARIS TIPIS */
.table-custom th,
.table-custom td {
    border: 1px solid #999;
}

/* LIST */
.list {
    text-align: left;
    margin: 0 auto 30px;
    width: 80%;
}

.list li {
    padding: 8px;
    border-bottom: 1px solid #ccc;
}

/* CARD */
.card-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.card {
    width: 140px;
    padding: 15px;
    border-radius: 10px;
    background: #f5f5f5;
    box-shadow: 0 0 3px rgba(0,0,0,0.2);
}

</style>
</head>
<body>

<div class="container">

    <h2>TABLE 1 (Render Biasa)</h2>
    <table class="table-custom">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table1"></tbody>
    </table>

    <h2>TABLE 2 (DRY, REUSE, MODULAR)</h2>
    <table class="table-custom">
        <thead>
            <tr><th>ID</th><th>Nama</th></tr>
        </thead>
        <tbody id="table2"></tbody>
    </table>

    <h2>LIST 1 (Dari Table 1)</h2>
    <ul id="list1" class="list"></ul>

    <h2>LIST 2 (Dari Table 2)</h2>
    <ul id="list2" class="list"></ul>

    <h2>CARD 1 (Dari Table 1)</h2>
    <div id="card1" class="card-container"></div>

    <h2>CARD 2 (Dari Table 2)</h2>
    <div id="card2" class="card-container"></div>

</div>

<script>

// DATA
const data = [
    { id: 1, nama: "Reyshan" },
    { id: 2, nama: "Adjie" },
    { id: 3, nama: "Dimas" },
    { id: 4, nama: "Didi" }
];

// TEMPLATE
const tableRow = (item) => `
<tr>
    <td>${item.id}</td>
    <td>${item.nama}</td>
</tr>`;

const listItem = (item) => `
<li>${item.id} - ${item.nama}</li>`;

const cardItem = (item) => `
<div class="card">
    <strong>${item.nama}</strong>
    <p>ID: ${item.id}</p>
</div>`;

// CORE RENDER (DRY)
function render(target, template) {
    document.getElementById(target).innerHTML =
        data.map(template).join("");
}

// INIT
render("table1", tableRow);
render("table2", tableRow);
render("list1", listItem);
render("list2", listItem);
render("card1", cardItem);
render("card2", cardItem);

</script>

</body>
</html>
